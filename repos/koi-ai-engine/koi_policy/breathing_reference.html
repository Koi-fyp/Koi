<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOI Exercises Reference</title>
<style>
  :root { --bg:#f7f6f2; --card:#ffffff; --ink:#1f2328; --muted:#5b6370; --accent:#2f7d6d; --accent-soft:#cfe7e1; --line:#dedbd2; --warn:#8a4b00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15181c; --card:#1d2126; --ink:#e7e9ec; --muted:#a3abb6; --accent:#5fb8a4; --accent-soft:#23413b; --line:#2c3138; --warn:#f0b35a; } }
  :root[data-theme="dark"] { --bg:#15181c; --card:#1d2126; --ink:#e7e9ec; --muted:#a3abb6; --accent:#5fb8a4; --accent-soft:#23413b; --line:#2c3138; --warn:#f0b35a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Nastaliq Urdu", "Noto Naskh Arabic", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  .badge { display:inline-block; font-size:12px; color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:2px 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
  h1 { font-size:20px; margin:12px 0 4px; }
  h2 { font-size:17px; margin:0 0 6px; }
  p { margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 14px; cursor:pointer; min-height:44px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  textarea, input[type=number] { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; }
  textarea { min-height:80px; }
  .stage { display:grid; place-items:center; height:240px; }
  .orb { width:120px; height:120px; border-radius:50%; background:var(--accent-soft); border:3px solid var(--accent); transform:scale(0.7); transition-property:transform; transition-timing-function:ease-in-out; }
  .phase { font-size:20px; font-weight:600; min-height:30px; }
  .center { text-align:center; }
  .count { color:var(--muted); }
  .lib button { width:100%; text-align:start; }
  .chip { font-size:12px; color:var(--muted); }
  [dir="rtl"] .phase, [dir="rtl"] p { line-height:1.9; }
  @media (prefers-reduced-motion: reduce) { .orb { transition:none !important; } }
  .hidden { display:none; }
</style>
</head>
<body>

</main>

<script id="data" type="application/json">{"en": {"_status": "DRAFT v3 by Claude, Oct 15 2026. Not reviewed by a clinician. Languages: en (default), ur (Urdu script), ur-roman (Roman Urdu with natural English code-switching) in exercises_i18n.json, all pending native review. Wording is Claude's adaptation; structure follows the cited sources. Every number is listed in NUMBERS with its source or marked as an engineering default.", "_urdu": "Drafted by Claude (exercises_i18n.json), pending native review. Reviewer can align terms with WHO's official Urdu PM+ and the Urdu Thinking Healthy Programme.", "_safety_rules": ["No exercise is ever offered at CRITICAL. PM+ 'was not developed for use with ... a plan to end one's life in the near future', and THP excludes imminent suicide risk: exercises are never a substitute for the crisis path.", "At HIGH, only exercises with crisis_modal_ok=true may appear, below the helplines, never auto-started (Decision 2, pending Ahmad).", "Every free-text answer the user types inside an exercise is still a conversational turn: it passes through the per-turn crisis check, and HIGH/CRITICAL interrupts the exercise (policy.py R1).", "Breathing: no breath holds and no 'deep breaths'. WHO DWM: if breathing makes you dizzy, 'DO NOT take deep breaths'.", "Eyes-open by default; no long eyes-closed or body-scan practices (meditation-related adverse experiences are documented: Lindahl et al. 2017, PLOS ONE).", "Thought and problem exercises stop and offer help if the topic is self-harm, harming others, abuse or danger; they are not for working on trauma memories."], "review_status": "draft-unreviewed", "offer": {"text": "Would you like to try a short breathing exercise with me? You can choose 1 minute or 5 minutes.", "buttons": ["Yes, let's try", "What is it?", "Not now"], "what_is_it": "You breathe a little more slowly than usual, about six breaths a minute, following a circle on the screen. Slow breathing is linked with feeling calmer and less anxious. You can stop at any time."}, "decline_followup": {"text": "That's okay. Is it the breathing itself, or just not the right moment?", "buttons": ["Breathing isn't for me", "Not the right moment"], "alternatives": {"Breathing isn't for me": {"text": "Fair enough. Some people find it easier to notice what's around them instead. Would you like to try one of these?", "offer_exercises": ["grounding_54321", "dwm_grounding"], "later_button": "Just keep talking"}, "Not the right moment": {"text": "No problem. If you have about 30 seconds, there's a very short one you can do anywhere. Or we can leave it for later.", "offer_exercises": ["dwm_unhooking"], "later_button": "Maybe later"}}}, "safety_note": "Breathe at a pace that feels okay for you. You can stop at any time. If you feel dizzy or more uneasy, stop and breathe normally.", "post_check": {"text": "How is your mood right now?", "scale": {"min": 1, "max": 5, "min_label": "Very low", "max_label": "Very good"}, "maps_to": "mood_rating (client-side encrypted, Blueprint v4.14)", "low_threshold": 2, "on_low": "Thanks for telling me. Do you want to talk about what's going on?", "on_other": "Thanks for checking in.", "save_go_to": "Save this as my go-to exercise", "keep_talking": "Keep talking"}, "exercises": [{"id": "slow_breathing", "title": "Slow breathing", "family": "calm_body", "type": "paced_breathing", "ux_flows": ["5"], "activity_type": "calm", "source": "Pace: resonance breathing at ~6 breaths/min (Lehrer & Gevirtz 2014) and slow breathing <10/min (Zaccaro et al. 2018). Session: 5 min/day (Balban et al. 2023). Structure adapted from WHO PM+ 'Managing stress' and WHO DWM grounding.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "duration_min": 1, "what_is_it": "Breathe in gently, then breathe out a little longer, about six breaths a minute, following a circle.", "intro": "Let's slow the breath down together. Follow the circle: breathe in as it grows, and out as it shrinks.", "phases": [{"label": "Breathe in", "seconds": 4, "animate": "expand"}, {"label": "Breathe out", "seconds": 6, "animate": "contract"}], "cycles": 6, "cautions": ["No breath holds.", "Normal-sized breaths, not deep ones.", "Stop and breathe normally if dizzy."], "outro": "Well done. Take a moment before you carry on.", "duration_options": [{"label": "1 minute", "cycles": 6}, {"label": "5 minutes", "cycles": 30}], "crisis_modal_note": "Allowed below the helplines at HIGH (Ahmad, Oct 15: prefer the wider pool). Never at CRITICAL."}, {"id": "cyclic_sighing", "title": "Cyclic sighing", "family": "calm_body", "type": "paced_breathing", "ux_flows": ["5"], "activity_type": "calm", "source": "Balban et al. 2023, Cell Reports Medicine (RCT, n=108): 5 minutes/day of cyclic sighing gave the largest daily improvement in positive mood of the techniques tested, and reduced anxiety.", "licence": "Published study; wording by Claude", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "crisis_modal_note": "Not in the crisis modal: the double inhale is more effortful than plain slow breathing.", "duration_min": 1, "duration_options": [{"label": "1 minute", "cycles": 6}, {"label": "5 minutes", "cycles": 33}], "what_is_it": "Two breaths in through the nose (a normal one, then a short top-up), then a long, slow breath out through the mouth. A study found five minutes a day of this lifted mood.", "intro": "Breathe in through your nose, add a short second sip of air, then let it all out slowly through your mouth.", "phases": [{"label": "Breathe in through your nose", "seconds": 2, "animate": "expand"}, {"label": "Short top-up breath in", "seconds": 1, "animate": "expand_more"}, {"label": "Breathe out slowly through your mouth", "seconds": 6, "animate": "contract"}], "cycles": 6, "cautions": ["No breath holds.", "Keep the top-up small and gentle.", "Stop and breathe normally if dizzy."], "outro": "Nicely done. Notice how your body feels now."}, {"id": "dwm_grounding", "title": "Notice, slow down, refocus", "family": "calm_body", "type": "stepwise", "ux_flows": ["5", "4"], "activity_type": "calm", "source": "Adapted from WHO 'Doing What Matters in Times of Stress' (2020), skill 1: grounding.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "crisis_modal_note": "Allowed below the helplines at HIGH; never auto-started; never at CRITICAL. DWM describes grounding as keeping you safe 'until the storm passes'.", "duration_min": 2, "what_is_it": "A two-minute way to steady yourself when feelings are strong: notice what's happening, slow down, and bring your attention back to where you are.", "intro": "When feelings are strong, it can help to steady yourself first. Take each step at your own pace and tap Next when you're ready.", "steps": ["Notice what you're feeling and thinking right now. You don't have to change it, just notice it.", "Slow down. Breathe out slowly, gently stretch your arms or shoulders, and press your feet into the floor.", "Look around and name a few things you can see.", "Listen for a few things you can hear.", "Notice something you can touch: the chair, your clothes, the phone in your hand.", "Now bring your attention back to what you were doing and who is around you."], "outro": "This doesn't make the feelings disappear, but it can help you stay steady until they ease."}, {"id": "grounding_54321", "title": "5-4-3-2-1 senses", "family": "calm_body", "type": "stepwise", "ux_flows": ["5"], "activity_type": "calm", "source": "Common counting variant of the 'refocus' step in WHO DWM grounding (which names five things you can see and three or four you can hear). The 5-4-3-2-1 counting itself is not from DWM.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "duration_min": 2, "what_is_it": "A short exercise that uses your five senses to bring your attention back to the room you're in.", "intro": "Let's bring your attention to what's around you. Take each step at your own pace and tap Next when you're ready.", "steps": ["Look around and notice 5 things you can see.", "Notice 4 things you can feel, like your feet on the floor or the chair under you.", "Listen for 3 things you can hear.", "Notice 2 things you can smell, or two smells you like.", "Notice 1 thing you can taste, or take a sip of water."], "outro": "Nice work. Notice how you feel right now."}, {"id": "dwm_unhooking", "title": "Unhooking from a thought", "family": "thoughts", "type": "stepwise", "ux_flows": ["5", "10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 2: unhooking (notice, name, refocus).", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "duration_min": 0.5, "what_is_it": "A 30-second skill for when a worrying thought keeps pulling you away: notice it, give it a name, and come back to what you're doing.", "intro": "Sometimes a thought grabs hold and drags our attention away. Here's a quick way to unhook.", "steps": ["Notice: is a thought or feeling pulling your attention away right now?", "Name it quietly to yourself, for example: 'I'm noticing the thought that I'm not good enough' or 'I'm noticing a knot in my stomach.'", "Refocus: bring your attention back to what you're doing, or to this conversation, and give it your full attention."], "outro": "Thoughts may come back, and that's normal. Each time, you can notice, name and refocus again."}, {"id": "dwm_being_kind", "title": "Being kind to yourself", "family": "thoughts", "type": "stepwise", "ux_flows": ["5", "10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 4: being kind.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "duration_min": 2, "what_is_it": "A short exercise for when you're being hard on yourself: notice the unkind thoughts and try talking to yourself the way you'd talk to a friend.", "intro": "We're often much harsher with ourselves than with anyone else. Let's try something different for a minute.", "steps": ["Notice any unkind thoughts you've been having about yourself. Unkind thoughts are very common, and that's okay.", "Name them: 'I'm noticing I'm being hard on myself.'", "Ask: what would I say to a close friend who felt this way?", "Try saying something like that to yourself, quietly or in your head.", "If it feels okay, place a hand where you feel the hurt, maybe your chest, and breathe slowly and warmly towards it."], "outro": "Being kind to yourself is a skill. It can feel strange at first, and it gets easier with practice."}, {"id": "dwm_making_room", "title": "Making room for a feeling", "family": "thoughts", "type": "stepwise", "ux_flows": ["10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 5: making room.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": [], "user_initiated_only": true, "crisis_modal_ok": false, "why_not_offered": "It asks the user to stay with a painful feeling, which can intensify it; Claude's judgement is that it should only be chosen by the user or used inside the CBT module, never auto-offered.", "duration_min": 3, "what_is_it": "An exercise for a painful feeling that won't go away: instead of fighting it, you look at it with curiosity and let it be there for a moment.", "intro": "Feelings are a bit like the weather: they come and they go. Let's try making a little room for one, eyes open, at your own pace. You can stop at any point.", "steps": ["Notice a feeling that's here right now, and name it: 'Here is sadness' or 'Here is worry.'", "Get curious: where do you feel it in your body? If it had a size, shape or colour, what would it be?", "Breathe slowly in and around it. You don't have to like it, just let it be there for a moment.", "Now widen your attention back out: notice the room around you and what you were doing."], "stop_if": "If the feeling gets much stronger or overwhelming, stop and switch to 'Notice, slow down, refocus'.", "outro": "You let the feeling be there without being pushed around by it. That's a real skill."}, {"id": "thought_check", "title": "Checking an unhelpful thought", "family": "thoughts", "type": "conversation", "ux_flows": ["10"], "activity_type": "mind", "source": "Core CBT skill (identifying and challenging unhelpful thoughts), as used in the WHO Thinking Healthy Programme (CBT-based, trialled in rural Pakistan, Urdu translation available). Loneliness focus: Masi et al. (2011) found interventions targeting maladaptive social cognition were the most effective loneliness interventions. The Socratic prompts are Claude's wording.", "licence": "Claude's wording; THP licence not confirmed", "offer_when": [], "cbt_module": true, "crisis_modal_ok": false, "duration_min": 5, "what_is_it": "A step-by-step way to look at a thought that's bringing you down, check how true it really is, and find a fairer way to see things. It's one of the main tools in CBT.", "intro": "Let's look at one thought together. I'll ask a few questions; answer in your own words, and you can stop at any time.", "examples_for_loneliness": ["Nobody wants to talk to me.", "If I message them, I'll just be bothering them.", "Everyone else has friends except me."], "prompts": [{"ask": "What's the thought that's bothering you? Try to write it as a sentence.", "answer": "text", "key": "thought"}, {"ask": "How strongly do you believe it right now, from 0 to 100?", "answer": "number_0_100", "key": "belief_before"}, {"ask": "What makes you think this thought is true?", "answer": "text", "key": "evidence_for"}, {"ask": "Is there anything that doesn't quite fit with it, even something small?", "answer": "text", "key": "evidence_against"}, {"ask": "If a close friend had this thought about themselves, what would you say to them?", "answer": "text", "key": "friend_view"}, {"ask": "Putting that together, is there a fairer or kinder way to say the thought?", "answer": "text", "key": "balanced_thought"}, {"ask": "How strongly do you believe the original thought now, from 0 to 100?", "answer": "number_0_100", "key": "belief_after"}], "reflection": "Thoughts aren't facts. Even a small shift in how strongly you believe a thought can make a difference.", "stop_if": "If the thought is about hurting yourself or someone else, the exercise stops and the crisis path takes over. Not for working through traumatic memories.", "save": "Save this so you can look back at it later"}, {"id": "pmplus_get_going", "title": "One small thing today", "family": "doing", "type": "conversation", "ux_flows": ["12", "2", "6"], "activity_type": "activity", "source": "Adapted from WHO PM+ (2018) strategy 'Get going, keep doing' (behavioural activation: increasing activity to improve mood); THP also uses behavioural activation. Step wording and the activity examples are Claude's.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 3, "what_is_it": "When we feel low, we tend to do less, and doing less makes us feel lower. This breaks the cycle with one small, doable activity.", "intro": "Let's pick one small thing you could do today or tomorrow, something pleasant or something useful.", "activity_examples": ["Have chai with someone at home", "A 10-minute walk outside", "Listen to a song you like", "Cook or help cook something", "Sit in the sun for a few minutes", "Tidy one small corner", "Play a sport or a game for a bit", "Something that feels meaningful to you"], "prompts": [{"ask": "What's one small thing you could do? Pick from the list or write your own.", "answer": "choice_or_text", "key": "activity"}, {"ask": "When could you do it? Be as specific as you can.", "answer": "text", "key": "when"}, {"ask": "How confident are you that you'll do it, from 0 (not at all) to 10 (completely)?", "answer": "number_0_10", "key": "commitment"}], "if_commitment_below": {"value": 7, "say": "Let's make it a bit smaller so it feels doable. What's a shorter or simpler version?", "source": "Brief Action Planning: below 7, problem-solve the plan."}, "follow_up": "Asked at the next check-in (UX Flow 2). If it didn't happen, gently explore what got in the way and make the task smaller. Never penalised (UX Flows 2 and 12).", "save": "Add to my tasks"}, {"id": "pmplus_managing_problems", "title": "Working through a problem", "family": "doing", "type": "conversation", "ux_flows": ["10", "12"], "activity_type": "activity", "source": "Adapted from WHO PM+ (2018) strategy 'Managing problems' (listing possible solutions and choosing the most helpful); structured problem-solving is also part of THP. Step wording is Claude's.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 6, "what_is_it": "A step-by-step way to break a practical problem into pieces, think of options, and choose a first step.", "intro": "Let's take one problem and break it down. We'll go step by step.", "prompts": [{"ask": "What's one problem that's on your mind? A practical one works best.", "answer": "text", "key": "problem"}, {"ask": "Is any part of this something you can change, even a little?", "answer": "yes_no", "key": "changeable", "if_no": "Some problems can't be changed right now. In that case, looking after how you cope matters more. Would you like to try 'Making room for a feeling' or 'Being kind to yourself'?"}, {"ask": "Let's list ideas, without judging them yet. What are some things you could do? Write as many as you like.", "answer": "text_list", "key": "options"}, {"ask": "Which idea looks most helpful and doable?", "answer": "choice_from_options", "key": "chosen"}, {"ask": "What's the very first step, and when will you do it?", "answer": "text", "key": "first_step"}, {"ask": "Is there anyone who could help with this?", "answer": "text", "key": "helper"}], "stop_if": "If the problem involves danger, abuse, or harming yourself or others, stop and show the help options instead of problem-solving.", "follow_up": "Review at the next check-in: what happened, and what's the next step?", "save": "Add the first step to my tasks"}, {"id": "dwm_values_step", "title": "A step towards what matters", "family": "doing", "type": "conversation", "ux_flows": ["10", "11", "12"], "activity_type": "connection", "source": "Adapted from WHO DWM (2020), skill 3: acting on values (choose values, pick one relationship, one small action this week).", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 4, "what_is_it": "Values are about the kind of person you want to be, like caring, honest or brave. This helps you choose one small action that fits them.", "intro": "Goals are what we want to get; values are the kind of person we want to be. Let's find one small step that fits yours.", "value_examples": ["Caring", "Honest", "Brave", "Patient", "Fun", "Respectful", "Helpful", "Hard-working"], "prompts": [{"ask": "Which one or two of these matter most to you? Or write your own.", "answer": "choice_or_text", "key": "values"}, {"ask": "Think of one relationship that matters to you. Who is it?", "answer": "text", "key": "relationship"}, {"ask": "What's one small thing you could do this week, in that relationship, that fits your values?", "answer": "text", "key": "action"}], "save": "Add to my tasks"}, {"id": "pmplus_social_support", "title": "Who's in my corner?", "family": "connection", "type": "conversation", "ux_flows": ["11", "12"], "activity_type": "connection", "source": "Adapted from WHO PM+ (2018) strategy 'Strengthening social support' (support from trusted friends, family, co-workers or community organisations). Pairs with thought_check for loneliness thoughts (Masi et al. 2011). Prompts are Claude's wording.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 4, "what_is_it": "A short exercise to notice who you could lean on, even a little, and pick one easy way to connect.", "intro": "When we feel alone, it's easy to forget the people who might be there for us. Let's take a gentle look.", "prompts": [{"ask": "Who is someone you feel safe with, even if you haven't talked in a while? A friend, cousin, sibling, classmate, neighbour or teacher all count.", "answer": "text", "key": "person"}, {"ask": "What's one easy way to connect with them? For example: send a short message, share something funny, or ask how they are.", "answer": "text", "key": "contact_step"}, {"ask": "Is there a group or place where you could be around people, like a class, a community or religious group, or a sports ground?", "answer": "text_optional", "key": "community"}, {"ask": "How uneasy would that step feel, from 0 (completely calm) to 100 (the most uneasy you can imagine)?", "answer": "number_0_100", "key": "suds"}, {"ask": "How confident are you that you'll take that step, from 0 (not at all) to 10 (completely)?", "answer": "number_0_10", "key": "commitment"}], "safety": "Only people the user feels safe with. Never suggest contacting a specific person, and never push contact with anyone the user describes as hurtful or unsafe.", "next": "Can become the first step on the Social Ladder (UX Flow 11).", "save": "Add to my tasks", "if_commitment_below": {"value": 7, "say": "That's okay. What would make it easier, or is there a smaller first step, like just reading their last message?", "source": "Brief Action Planning: below 7, problem-solve the plan."}, "ladder_rules": {"scale": "SUDS 0-100 (Wolpe)", "max_gap_between_steps": 10, "if_gap_larger": "split the step into smaller steps (UX Flow 11 'step-splitting')", "rate_before_and_after": true}}], "considered_and_not_added": [{"what": "Breathing with holds (box breathing, 4-7-8)", "why": "Breath holds can feel uncomfortable for anxious users, and WHO DWM warns against deep breaths when dizzy. Kept out of the default."}, {"what": "Long eyes-closed meditation or body scans", "why": "Meditation-related challenging experiences are documented (Lindahl et al. 2017). Not suitable unsupervised for a distressed audience."}, {"what": "Imagery or working through traumatic memories", "why": "Needs a clinician."}, {"what": "Progressive muscle relaxation, gratitude journaling", "why": "Common, but not sourced in this session. Can be added after sourcing."}, {"what": "Any exercise at CRITICAL, or as a replacement for helplines", "why": "PM+ and THP both exclude people with a plan to end their life or at imminent suicide risk."}], "_licence_note": "Licensing of adapted WHO material is being handled by the university (Ahmad, Oct 15 2026). Source attributions are kept for traceability.", "NUMBERS": [{"what": "Slow breathing pace", "value": "6 breaths/min (4 s in, 6 s out)", "status": "sourced", "source": "Resonance breathing ~0.1 Hz = six breaths per minute (Lehrer & Gevirtz 2014, Frontiers in Psychology); slow breathing defined as <10 breaths/min with reduced anxiety and arousal (Zaccaro et al. 2018 systematic review)."}, {"what": "Exhale longer than inhale", "value": "6 s out vs 4 s in", "status": "sourced, weak", "source": "An RCT comparing longer-exhale vs equal ratios found a small, non-significant extra benefit (d=0.2); 'breath ratios do not have a significant differential effect'. Kept because WHO DWM also says 'breathe out slowly'."}, {"what": "Breathing session length", "value": "1 min quick, or 5 min", "status": "sourced (5 min)", "source": "5 minutes daily of cyclic sighing improved mood and reduced anxiety over a month (Balban et al. 2023, Cell Reports Medicine RCT, n=108). The 1-minute option is a convenience choice with no specific source."}, {"what": "Cyclic sighing pattern", "value": "2 s in + 1 s top-up in, 6 s slow out (about 6-7 breaths/min)", "status": "pattern sourced, seconds estimated", "source": "Pattern from Balban et al. 2023 (two inhales, long exhale). Second counts are Claude's estimate kept under 10 breaths/min (Zaccaro 2018)."}, {"what": "Action-plan confidence check", "value": "0-10; below 7 -> make the plan smaller", "status": "sourced", "source": "Brief Action Planning (clinician technique): when confidence is below 7, use collaborative problem solving; people are more likely to succeed at 7 or more."}, {"what": "Distress rating for Social Ladder steps", "value": "SUDS 0-100; adjacent steps no more than 10 apart, else split", "status": "sourced", "source": "Wolpe's Subjective Units of Disturbance scale (0-100); hierarchy items spaced 'no more than 5 to 10 SUDs' apart."}, {"what": "Belief rating in thought check", "value": "0-100", "status": "convention", "source": "Standard CBT thought-record convention (Beck); not re-verified in this session."}, {"what": "Mood check", "value": "1-5", "status": "engineering default", "source": "No clinical source; simple scale chosen for a phone. Maps to the existing mood_rating field."}, {"what": "Offers per day", "value": "max 3", "status": "sourced", "source": "Morrison et al. 2017 (PLOS ONE): up to 3 notifications/day did not lower response rates; authors caution several per day may be unacceptable and exact thresholds are unknown."}, {"what": "CBT offer cooldown", "value": "24 h (72 h after 2 declines)", "status": "24 h loosely sourced; 72 h engineering default", "source": "A daily schedule had no response-rate penalty (Morrison et al. 2017)."}, {"what": "Crisis threshold for offers", "value": "MODERATE starts at 0.40", "status": "sourced (project canon)", "source": "Blueprint §4.1 risk bands."}, {"what": "Smoothing and hysteresis (EWMA 0.3, disarm 0.30, min 3 turns), grounding cooldown 2 h", "value": "as stated", "status": "engineering default", "source": "No clinical source exists for these; they control how often the app interrupts, and are disclosed as tunable."}], "ui": {"next": "Next", "stop": "Stop", "pause": "Pause", "resume": "Resume", "skip": "Ski p on the Social Ladder (UX Flow 11).", "save": "میرے ٹاسکس میں شامل کریں", "if_commitment_below": {"value": 7, "say": "کوئی بات نہیں۔ کیا چیز اسے آسان بنا سکتی ہے، یا کوئی اس سے چھوٹا پہلا قدم ہے، جیسے بس ان کا آخری میسج پڑھ لینا؟", "source": "Brief Action Planning: below 7, problem-solve the plan."}, "ladder_rules": {"scale": "SUDS 0-100 (Wolpe)", "max_gap_between_steps": 10, "if_gap_larger": "split the step into smaller steps (UX Flow 11 'step-splitting')", "rate_before_and_after": true}}], "considered_and_not_added": [{"what": "Breathing with holds (box breathing, 4-7-8)", "why": "Breath holds can feel uncomfortable for anxious users, and WHO DWM warns against deep breaths when dizzy. Kept out of the default."}, {"what": "Long eyes-closed meditation or body scans", "why": "Meditation-related challenging experiences are documented (Lindahl et al. 2017). Not suitable unsupervised for a distressed audience."}, {"what": "Imagery or working through traumatic memories", "why": "Needs a clinician."}, {"what": "Progressive muscle relaxation, gratitude journaling", "why": "Common, but not sourced in this session. Can be added after sourcing."}, {"what": "Any exercise at CRITICAL, or as a replacement for helplines", "why": "PM+ and THP both exclude people with a plan to end their life or at imminent suicide risk."}], "_licence_note": "Licensing of adapted WHO material is being handled by the university (Ahmad, Oct 15 2026). Source attributions are kept for traceability.", "NUMBERS": [{"what": "Slow breathing pace", "value": "6 breaths/min (4 s in, 6 s out)", "status": "sourced", "source": "Resonance breathing ~0.1 Hz = six breaths per minute (Lehrer & Gevirtz 2014, Frontiers in Psychology); slow breathing defined as <10 breaths/min with reduced anxiety and arousal (Zaccaro et al. 2018 systematic review)."}, {"what": "Exhale longer than inhale", "value": "6 s out vs 4 s in", "status": "sourced, weak", "source": "An RCT comparing longer-exhale vs equal ratios found a small, non-significant extra benefit (d=0.2); 'breath ratios do not have a significant differential effect'. Kept because WHO DWM also says 'breathe out slowly'."}, {"what": "Breathing session length", "value": "1 min quick, or 5 min", "status": "sourced (5 min)", "source": "5 minutes daily of cyclic sighing improved mood and reduced anxiety over a month (Balban et al. 2023, Cell Reports Medicine RCT, n=108). The 1-minute option is a convenience choice with no specific source."}, {"what": "Cyclic sighing pattern", "value": "2 s in + 1 s top-up in, 6 s slow out (about 6-7 breaths/min)", "status": "pattern sourced, seconds estimated", "source": "Pattern from Balban et al. 2023 (two inhales, long exhale). Second counts are Claude's estimate kept under 10 breaths/min (Zaccaro 2018)."}, {"what": "Action-plan confidence check", "value": "0-10; below 7 -> make the plan smaller", "status": "sourced", "source": "Brief Action Planning (clinician technique): when confidence is below 7, use collaborative problem solving; people are more likely to succeed at 7 or more."}, {"what": "Distress rating for Social Ladder steps", "value": "SUDS 0-100; adjacent steps no more than 10 apart, else split", "status": "sourced", "source": "Wolpe's Subjective Units of Disturbance scale (0-100); hierarchy items spaced 'no more than 5 to 10 SUDs' apart."}, {"what": "Belief rating in thought check", "value": "0-100", "status": "convention", "source": "Standard CBT thought-record convention (Beck); not re-verified in this session."}, {"what": "Mood check", "value": "1-5", "status": "engineering default", "source": "No clinical source; simple scale chosen for a phone. Maps to the existing mood_rating field."}, {"what": "Offers per day", "value": "max 3", "status": "sourced", "source": "Morrison et al. 2017 (PLOS ONE): up to 3 notifications/day did not lower response rates; authors caution several per day may be unacceptable and exact thresholds are unknown."}, {"what": "CBT offer cooldown", "value": "24 h (72 h after 2 declines)", "status": "24 h loosely sourced; 72 h engineering default", "source": "A daily schedule had no response-rate penalty (Morrison et al. 2017)."}, {"what": "Crisis threshold for offers", "value": "MODERATE starts at 0.40", "status": "sourced (project canon)", "source": "Blueprint §4.1 risk bands."}, {"what": "Smoothing and hysteresis (EWMA 0.3, disarm 0.30, min 3 turns), grounding cooldown 2 h", "value": "as stated", "status": "engineering default", "source": "No clinical source exists for these; they control how often the app interrupts, and are disclosed as tunable."}], "ui": {"next": "آگے", "stop": "روکیں", "pause": "وقفہ", "resume": "جاری رکھیں", "skip": "چھوڑ دیں", "done": "ہو گیا", "yes": "ہاں", "no": "نہیں", "try_it": "آزمائیں", "smaller": "اسے چھوٹا کریں", "keep": "ایسے ہی رہنے دیں", "step_of": "قدم {i} از {n}", "question_of": "سوال {i} از {n}", "breath_of": "{s} سیکنڈ · سانس {c} از {n}", "stopped": "روک دیا گیا۔ یہ بالکل ٹھیک ہے۔", "all_exercises": "تمام ایکسرسائزز", "menu_note": "آپ ان میں سے کوئی بھی جب چاہیں شروع کر سکتے ہیں۔", "optional": "جواب دینا آپ کی مرضی ہے۔", "belief": "اس سوچ پر یقین: {a} ← {b}", "mood_n": "موڈ 5 میں سے {n}", "minutes": "منٹ", "seconds": "سیکنڈ", "families": {"calm_body": "جسم کو پُرسکون کریں", "thoughts": "سوچوں کے ساتھ کام", "doing": "کچھ کرنا شروع کریں", "connection": "لوگوں سے جُڑیں"}}, "lang": "ur"}, "ur-roman": {"_status": "DRAFT v3 by Claude, Oct 15 2026. Not reviewed by a clinician. Languages: en (default), ur (Urdu script), ur-roman (Roman Urdu with natural English code-switching) in exercises_i18n.json, all pending native review. Wording is Claude's adaptation; structure follows the cited sources. Every number is listed in NUMBERS with its source or marked as an engineering default.", "_urdu": "Drafted by Claude (exercises_i18n.json), pending native review. Reviewer can align terms with WHO's official Urdu PM+ and the Urdu Thinking Healthy Programme.", "_safety_rules": ["No exercise is ever offered at CRITICAL. PM+ 'was not developed for use with ... a plan to end one's life in the near future', and THP excludes imminent suicide risk: exercises are never a substitute for the crisis path.", "At HIGH, only exercises with crisis_modal_ok=true may appear, below the helplines, never auto-started (Decision 2, pending Ahmad).", "Every free-text answer the user types inside an exercise is still a conversational turn: it passes through the per-turn crisis check, and HIGH/CRITICAL interrupts the exercise (policy.py R1).", "Breathing: no breath holds and no 'deep breaths'. WHO DWM: if breathing makes you dizzy, 'DO NOT take deep breaths'.", "Eyes-open by default; no long eyes-closed or body-scan practices (meditation-related adverse experiences are documented: Lindahl et al. 2017, PLOS ONE).", "Thought and problem exercises stop and offer help if the topic is self-harm, harming others, abuse or danger; they are not for working on trauma memories."], "review_status": "draft-unreviewed", "offer": {"text": "Kya aap mere saath breathing ki ek choti si exercise karna chahenge? Aap 1 minute ya 5 minute choose kar sakte hain.", "buttons": ["Haan, karte hain", "Yeh kya hai?", "Abhi nahi"], "what_is_it": "Is mein aap normal se thora aahista saans lete hain, taqreeban ek minute mein 6 saans, screen par ek circle ke saath saath. Aahista saans lena zyada sukoon aur kam ghabrahat se juda hua hai. Aap kisi bhi waqt stop kar sakte hain."}, "decline_followup": {"text": "Koi baat nahi. Kya breathing wali exercise ka masla hai, ya bas abhi sahi waqt nahi?", "buttons": ["Breathing mere liye nahi", "Abhi sahi waqt nahi"], "alternatives": {"Breathing mere liye nahi": {"text": "Theek hai. Kuch logon ko apne aas paas ki cheezon par dhyan dena zyada asaan lagta hai. Kya aap in mein se koi try karna chahenge?", "offer_exercises": ["grounding_54321", "dwm_grounding"], "later_button": "Bas baat karte rehte hain"}, "Abhi sahi waqt nahi": {"text": "Koi masla nahi. Agar aap ke paas taqreeban 30 second hain to ek bohat choti exercise hai jo kahin bhi ho sakti hai. Ya hum isay baad ke liye chhor dete hain.", "offer_exercises": ["dwm_unhooking"], "later_button": "Shayad baad mein"}}}, "safety_note": "Utni speed se saans lein jo aap ko theek lage. Aap kisi bhi waqt stop kar sakte hain. Agar chakkar aaye ya bechaini barhe to ruk jayein aur normal saans lein.", "post_check": {"text": "Is waqt aap ka mood kaisa hai?", "scale": {"min": 1, "max": 5, "min_label": "Bohat bura", "max_label": "Bohat acha"}, "maps_to": "mood_rating (client-side encrypted, Blueprint v4.14)", "low_threshold": 2, "on_low": "Batane ka shukriya. Kya aap is baare mein baat karna chahenge ke kya chal raha hai?", "on_other": "Batane ka shukriya.", "save_go_to": "Isay meri go-to exercise ke taur par save karein", "keep_talking": "Baat jaari rakhein"}, "exercises": [{"id": "slow_breathing", "title": "Aahista saans", "family": "calm_body", "type": "paced_breathing", "ux_flows": ["5"], "activity_type": "calm", "source": "Pace: resonance breathing at ~6 breaths/min (Lehrer & Gevirtz 2014) and slow breathing <10/min (Zaccaro et al. 2018). Session: 5 min/day (Balban et al. 2023). Structure adapted from WHO PM+ 'Managing stress' and WHO DWM grounding.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "duration_min": 1, "what_is_it": "Aaram se saans andar lein, phir thora lamba saans bahar nikaalein, taqreeban ek minute mein 6 saans, ek circle ke saath saath.", "intro": "Aayein mil kar saans ko slow karte hain. Circle ke saath chalein: jab yeh bara ho to saans andar lein, aur jab chhota ho to bahar nikaalein.", "phases": [{"label": "Saans andar", "seconds": 4, "animate": "expand"}, {"label": "Saans bahar", "seconds": 6, "animate": "contract"}], "cycles": 6, "cautions": ["Saans rokna nahi hai.", "Normal saans lein, bohat gehra nahi.", "Chakkar aaye to ruk jayein aur normal saans lein."], "outro": "Bohat khoob. Aagay barhne se pehle ek lamha lein.", "duration_options": [{"label": "1 minute", "cycles": 6}, {"label": "5 minute", "cycles": 30}], "crisis_modal_note": "Allowed below the helplines at HIGH (Ahmad, Oct 15: prefer the wider pool). Never at CRITICAL."}, {"id": "cyclic_sighing", "title": "Double saans, lambi aah", "family": "calm_body", "type": "paced_breathing", "ux_flows": ["5"], "activity_type": "calm", "source": "Balban et al. 2023, Cell Reports Medicine (RCT, n=108): 5 minutes/day of cyclic sighing gave the largest daily improvement in positive mood of the techniques tested, and reduced anxiety.", "licence": "Published study; wording by Claude", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "crisis_modal_note": "Not in the crisis modal: the double inhale is more effortful than plain slow breathing.", "duration_min": 1, "duration_options": [{"label": "1 minute", "cycles": 6}, {"label": "5 minute", "cycles": 33}], "what_is_it": "Naak se do saans andar (ek normal, phir ek chhota sa extra), phir munh se ek lamba, aahista saans bahar. Ek research mein roz 5 minute aisa karne se mood behtar hua.", "intro": "Naak se saans andar lein, phir halka sa ek aur ghoont hawa ka lein, phir munh se saari hawa aahista aahista bahar nikaalein.", "phases": [{"label": "Naak se saans andar", "seconds": 2, "animate": "expand"}, {"label": "Ek chhota extra saans andar", "seconds": 1, "animate": "expand_more"}, {"label": "Munh se aahista saans bahar", "seconds": 6, "animate": "contract"}], "cycles": 6, "cautions": ["Saans rokna nahi hai.", "Extra saans chhota aur naram rakhein.", "Chakkar aaye to ruk jayein aur normal saans lein."], "outro": "Bohat ache. Dekhein ab aap ka jism kaisa feel kar raha hai."}, {"id": "dwm_grounding", "title": "Dhyan dein, slow hon, wapas aayein", "family": "calm_body", "type": "stepwise", "ux_flows": ["5", "4"], "activity_type": "calm", "source": "Adapted from WHO 'Doing What Matters in Times of Stress' (2020), skill 1: grounding.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "crisis_modal_note": "Allowed below the helplines at HIGH; never auto-started; never at CRITICAL. DWM describes grounding as keeping you safe 'until the storm passes'.", "duration_min": 2, "what_is_it": "Jab feelings bohat strong hon to khud ko sambhalne ka 2 minute ka tareeqa: jo ho raha hai us par dhyan dein, slow hon, aur apni attention wapas wahan layein jahan aap hain.", "intro": "Jab feelings bohat strong hon to pehle khud ko sambhalna madad karta hai. Har step apni speed se karein aur ready hon to 'Aagay' dabayein.", "steps": ["Abhi aap kya feel kar rahe hain aur kya soch rahe hain, us par dhyan dein. Isay badalna zaroori nahi, bas notice karein.", "Slow hon. Aahista se saans bahar nikaalein, baazu ya kandhay halke se stretch karein, aur paon zameen par dabayein.", "Aas paas dekhein aur kuch cheezon ke naam lein jo aap dekh sakte hain.", "Kuch awaazein sunein jo aap ko sunayi de rahi hain.", "Kisi aisi cheez par dhyan dein jisay aap chhoo sakte hain: kursi, apne kapre, haath mein phone.", "Ab apni attention wapas us kaam par layein jo aap kar rahe the, aur un logon par jo aap ke aas paas hain."], "outro": "Is se feelings khatam nahi hoti, lekin yeh aap ko tab tak sambhale rakhne mein madad kar sakta hai jab tak woh halki na ho jayein."}, {"id": "grounding_54321", "title": "5-4-3-2-1 senses", "family": "calm_body", "type": "stepwise", "ux_flows": ["5"], "activity_type": "calm", "source": "Common counting variant of the 'refocus' step in WHO DWM grounding (which names five things you can see and three or four you can hear). The 5-4-3-2-1 counting itself is not from DWM.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": true, "duration_min": 2, "what_is_it": "Ek choti exercise jo aap ke paanchon senses ke zariye aap ki attention wapas us kamray mein lati hai jahan aap hain.", "intro": "Aayein apni attention aas paas ki cheezon par laate hain. Har step apni speed se karein aur ready hon to 'Aagay' dabayein.", "steps": ["Aas paas dekhein aur 5 cheezein notice karein jo aap dekh sakte hain.", "4 cheezein notice karein jo aap feel kar sakte hain, jaise zameen par paon ya neeche kursi.", "3 awaazein sunein jo aap ko sunayi de rahi hain.", "2 khushbuein notice karein, ya do aisi khushbuein sochein jo aap ko pasand hain.", "1 taste notice karein, ya paani ka ek ghoont lein."], "outro": "Bohat acha. Dekhein is waqt aap kaisa feel kar rahe hain."}, {"id": "dwm_unhooking", "title": "Kisi soch se khud ko chhuraana", "family": "thoughts", "type": "stepwise", "ux_flows": ["5", "10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 2: unhooking (notice, name, refocus).", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "duration_min": 0.5, "what_is_it": "30 second ki skill, jab koi pareshan karne wali soch baar baar aap ko kheench rahi ho: usay notice karein, usay naam dein, aur wapas apne kaam par aayein.", "intro": "Kabhi kabhi koi soch humein pakar leti hai aur hamari attention kheench le jaati hai. Is se nikalne ka ek quick tareeqa yeh hai.", "steps": ["Notice karein: kya is waqt koi soch ya feeling aap ki attention kheench rahi hai?", "Usay dil hi dil mein naam dein, maslan: 'Mujhe yeh soch aa rahi hai ke main kaafi acha nahi' ya 'Mujhe pait mein girah si feel ho rahi hai.'", "Wapas aayein: apni attention us kaam ya is baat cheet par wapas layein jo aap kar rahe hain, aur usay poori attention dein."], "outro": "Sochein wapas aa sakti hain, aur yeh normal hai. Har baar aap phir se notice kar sakte hain, naam de sakte hain, aur wapas aa sakte hain."}, {"id": "dwm_being_kind", "title": "Apne saath narmi", "family": "thoughts", "type": "stepwise", "ux_flows": ["5", "10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 4: being kind.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW", "MODERATE"], "crisis_modal_ok": false, "duration_min": 2, "what_is_it": "Ek choti exercise jab aap khud par sakhti kar rahe hon: apne baare mein sakht sochon ko notice karein aur khud se waise baat karein jaise kisi dost se karte hain.", "intro": "Hum aksar kisi aur ke muqable mein khud par bohat zyada sakht hote hain. Aayein ek minute ke liye kuch different try karte hain.", "steps": ["Apne baare mein aane wali sakht sochon ko notice karein. Aisi sochein bohat common hain, aur yeh theek hai.", "Unhein naam dein: 'Main notice kar raha/rahi hoon ke main khud par sakhti kar raha/rahi hoon.'", "Khud se poochein: agar mera koi qareebi dost aisa feel karta to main us se kya kehta/kehti?", "Waisi hi koi baat aahista se ya dil mein khud se keh kar dekhein.", "Agar theek lage to apna haath wahan rakhein jahan takleef feel ho, shayad seenay par, aur us ki taraf aahista aur narmi se saans lein."], "outro": "Apne saath narmi ek skill hai. Shuru mein ajeeb lag sakti hai, aur practice se asaan hoti jaati hai."}, {"id": "dwm_making_room", "title": "Kisi feeling ke liye jagah banana", "family": "thoughts", "type": "stepwise", "ux_flows": ["10"], "activity_type": "mind", "source": "Adapted from WHO DWM (2020), skill 5: making room.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": [], "user_initiated_only": true, "crisis_modal_ok": false, "why_not_offered": "It asks the user to stay with a painful feeling, which can intensify it; Claude's judgement is that it should only be chosen by the user or used inside the CBT module, never auto-offered.", "duration_min": 3, "what_is_it": "Us takleef deh feeling ke liye jo ja nahi rahi: us se larne ke bajaye aap usay curiosity se dekhte hain aur ek lamhe ke liye usay rehne dete hain.", "intro": "Feelings kuch mausam jaisi hoti hain: aati hain aur chali jaati hain. Aayein aankhein khuli rakh kar, apni speed se, kisi ek feeling ke liye thori jagah banane ki koshish karte hain. Aap kisi bhi waqt ruk sakte hain.", "steps": ["Jo feeling is waqt maujood hai usay notice karein aur naam dein: 'Yeh udaasi hai' ya 'Yeh pareshani hai.'", "Curiosity se dekhein: aap isay jism mein kahan feel karte hain? Agar is ka koi size, shape ya rang hota to kya hota?", "Is ke andar aur aas paas aahista saans lein. Isay pasand karna zaroori nahi, bas ek lamhe ke liye isay rehne dein.", "Ab apni attention phir se phailayein: apne aas paas ke kamray aur us kaam par dhyan dein jo aap kar rahe the."], "stop_if": "Agar feeling bohat strong ya bardasht se bahar ho jaye to ruk jayein aur 'Dhyan dein, slow hon, wapas aayein' par chalay jayein.", "outro": "Aap ne feeling ko rehne diya aur us ke aagay be-bas nahi hue. Yeh ek asal skill hai."}, {"id": "thought_check", "title": "Kisi unhelpful soch ko check karna", "family": "thoughts", "type": "conversation", "ux_flows": ["10"], "activity_type": "mind", "source": "Core CBT skill (identifying and challenging unhelpful thoughts), as used in the WHO Thinking Healthy Programme (CBT-based, trialled in rural Pakistan, Urdu translation available). Loneliness focus: Masi et al. (2011) found interventions targeting maladaptive social cognition were the most effective loneliness interventions. The Socratic prompts are Claude's wording.", "licence": "Claude's wording; THP licence not confirmed", "offer_when": [], "cbt_module": true, "crisis_modal_ok": false, "duration_min": 5, "what_is_it": "Step by step kisi aisi soch ko dekhne ka tareeqa jo aap ko udaas kar rahi ho, yeh check karna ke woh waqai kitni sach hai, aur cheezon ko dekhne ka zyada fair tareeqa dhoondna. Yeh CBT ke main tools mein se ek hai.", "intro": "Aayein mil kar ek soch ko dekhte hain. Main kuch sawal poochunga; apne alfaaz mein jawab dein, aur aap kisi bhi waqt ruk sakte hain.", "examples_for_loneliness": ["Koi mujh se baat nahi karna chahta.", "Agar main unhein message karunga/karungi to bas tang karunga/karungi.", "Mere ilawa sab ke dost hain."], "prompts": [{"ask": "Kaunsi soch aap ko pareshan kar rahi hai? Isay ek jumlay mein likhne ki koshish karein.", "answer": "text", "key": "thought"}, {"ask": "Is waqt aap is par kitna yaqeen rakhte hain, 0 se 100 tak?", "answer": "number_0_100", "key": "belief_before"}, {"ask": "Aap ko kyun lagta hai ke yeh soch sach hai?", "answer": "text", "key": "evidence_for"}, {"ask": "Kya koi baat aisi hai jo is se poori tarah match nahi karti, chahe choti si ho?", "answer": "text", "key": "evidence_against"}, {"ask": "Agar aap ke kisi qareebi dost ko apne baare mein yeh soch aati, to aap us se kya kehte?", "answer": "text", "key": "friend_view"}, {"ask": "Yeh sab mila kar, kya is soch ko kehne ka koi zyada fair ya naram tareeqa hai?", "answer": "text", "key": "balanced_thought"}, {"ask": "Ab aap asal soch par kitna yaqeen rakhte hain, 0 se 100 tak?", "answer": "number_0_100", "key": "belief_after"}], "reflection": "Sochein facts nahi hoti. Kisi soch par yaqeen mein thori si kami bhi farq daal sakti hai.", "stop_if": "Agar soch khud ko ya kisi aur ko nuqsan pohanchane ke baare mein ho to exercise ruk jaati hai aur madad wala raasta shuru ho jaata hai. Yeh takleef deh yaadon par kaam karne ke liye nahi hai.", "save": "Isay save karein taake baad mein dekh sakein"}, {"id": "pmplus_get_going", "title": "Aaj ek chhota sa kaam", "family": "doing", "type": "conversation", "ux_flows": ["12", "2", "6"], "activity_type": "activity", "source": "Adapted from WHO PM+ (2018) strategy 'Get going, keep doing' (behavioural activation: increasing activity to improve mood); THP also uses behavioural activation. Step wording and the activity examples are Claude's.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 3, "what_is_it": "Jab hum low feel karte hain to kam kaam karte hain, aur kam karne se aur low ho jaate hain. Yeh ek chhote, asaan kaam se is cycle ko torta hai.", "intro": "Aayein ek chhota sa kaam choose karte hain jo aap aaj ya kal kar sakein, kuch acha lagne wala ya kuch kaam ka.", "activity_examples": ["Ghar mein kisi ke saath chai piyein", "Bahar 10 minute ki walk", "Koi pasandeeda gaana sunein", "Kuch pakayein ya pakane mein madad karein", "Kuch minute dhoop mein baithein", "Ek chhota sa corner saaf karein", "Thori der koi game ya sport khelein", "Koi aisa kaam jo aap ke liye maayne rakhta ho"], "prompts": [{"ask": "Aap kaunsa ek chhota kaam kar sakte hain? List mein se choose karein ya apna likhein.", "answer": "choice_or_text", "key": "activity"}, {"ask": "Aap yeh kab kar sakte hain? Jitna ho sake clear batayein.", "answer": "text", "key": "when"}, {"ask": "Aap ko kitna confidence hai ke aap yeh kar lenge, 0 (bilkul nahi) se 10 (poori tarah) tak?", "answer": "number_0_10", "key": "commitment"}], "if_commitment_below": {"value": 7, "say": "Aayein isay thora chhota karte hain taake asaan lage. Is ka koi chhota ya asaan version kya ho sakta hai?", "source": "Brief Action Planning: below 7, problem-solve the plan."}, "follow_up": "Asked at the next check-in (UX Flow 2). If it didn't happen, gently explore what got in the way and make the task smaller. Never penalised (UX Flows 2 and 12).", "save": "Mere tasks mein add karein"}, {"id": "pmplus_managing_problems", "title": "Kisi masle ko solve karna", "family": "doing", "type": "conversation", "ux_flows": ["10", "12"], "activity_type": "activity", "source": "Adapted from WHO PM+ (2018) strategy 'Managing problems' (listing possible solutions and choosing the most helpful); structured problem-solving is also part of THP. Step wording is Claude's.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 6, "what_is_it": "Step by step kisi practical masle ko tukron mein baantne, options sochne, aur pehla step choose karne ka tareeqa.", "intro": "Aayein ek masla lete hain aur isay hisson mein baant-te hain. Hum step by step chalenge.", "prompts": [{"ask": "Kaunsa ek masla aap ke zehan mein hai? Practical masla sab se behtar rehta hai.", "answer": "text", "key": "problem"}, {"ask": "Kya is ka koi hissa aisa hai jisay aap badal sakte hain, chahe thora sa?", "answer": "yes_no", "key": "changeable", "if_no": "Kuch masle abhi badle nahi ja sakte. Aise mein yeh zyada important hai ke aap kaise sambhalte hain. Kya aap 'Kisi feeling ke liye jagah banana' ya 'Apne saath narmi' try karna chahenge?"}, {"ask": "Aayein abhi bina judge kiye ideas ki list banate hain. Aap kya kya kar sakte hain? Jitne chahein likhein.", "answer": "text_list", "key": "options"}, {"ask": "Kaunsa idea sab se zyada helpful aur mumkin lagta hai?", "answer": "choice_from_options", "key": "chosen"}, {"ask": "Bilkul pehla step kya hai, aur aap isay kab karenge?", "answer": "text", "key": "first_step"}, {"ask": "Kya koi hai jo is mein madad kar sake?", "answer": "text", "key": "helper"}], "stop_if": "Agar masle mein khatra, ziyadti, ya khud ko ya doosron ko nuqsan pohanchana shamil ho to problem solve karne ke bajaye ruk kar madad ke raaste dikhayein.", "follow_up": "Review at the next check-in: what happened, and what's the next step?", "save": "Pehla step mere tasks mein add karein"}, {"id": "dwm_values_step", "title": "Jo important hai us ki taraf ek step", "family": "doing", "type": "conversation", "ux_flows": ["10", "11", "12"], "activity_type": "connection", "source": "Adapted from WHO DWM (2020), skill 3: acting on values (choose values, pick one relationship, one small action this week).", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 4, "what_is_it": "Values is baare mein hain ke aap kaisa insaan banna chahte hain, jaise khayal rakhne wala, imaandar ya bahadur. Yeh aap ko un se match karta ek chhota step choose karne mein madad deta hai.", "intro": "Goals woh hain jo hum haasil karna chahte hain; values yeh hain ke hum kaisa insaan banna chahte hain. Aayein aap ki values se match karta ek chhota step dhoondte hain.", "value_examples": ["Khayal rakhne wala", "Imaandar", "Bahadur", "Sabr wala", "Khush mizaaj", "Izzat karne wala", "Madadgaar", "Mehnati"], "prompts": [{"ask": "In mein se kaunsi ek ya do cheezein aap ke liye sab se important hain? Ya apni likhein.", "answer": "choice_or_text", "key": "values"}, {"ask": "Kisi ek rishte ke baare mein sochein jo aap ke liye important hai. Woh kaun hai?", "answer": "text", "key": "relationship"}, {"ask": "Is hafte us rishte mein aap kaunsa ek chhota kaam kar sakte hain jo aap ki values se match kare?", "answer": "text", "key": "action"}], "save": "Mere tasks mein add karein"}, {"id": "pmplus_social_support", "title": "Mere saath kaun hai?", "family": "connection", "type": "conversation", "ux_flows": ["11", "12"], "activity_type": "connection", "source": "Adapted from WHO PM+ (2018) strategy 'Strengthening social support' (support from trusted friends, family, co-workers or community organisations). Pairs with thought_check for loneliness thoughts (Masi et al. 2011). Prompts are Claude's wording.", "licence": "CC BY-NC-SA 3.0 IGO (adaptation)", "offer_when": ["LOW"], "crisis_modal_ok": false, "duration_min": 4, "what_is_it": "Ek choti exercise yeh dekhne ke liye ke aap kis par thora sa bhi bharosa kar sakte hain, aur rabtay ka ek asaan tareeqa choose karne ke liye.", "intro": "Jab hum akela feel karte hain to un logon ko bhoolna asaan hota hai jo shayad hamare liye maujood hon. Aayein naram andaaz mein dekhte hain.", "prompts": [{"ask": "Koi aisa shakhs jis ke saath aap safe feel karte hain, chahe kaafi arsay se baat na hui ho? Dost, cousin, behan bhai, classmate, parosi ya teacher, sab shamil hain.", "answer": "text", "key": "person"}, {"ask": "Un se judne ka ek asaan tareeqa kya hai? Maslan ek chhota sa message bhejein, koi funny cheez share karein, ya haal pooch lein.", "answer": "text", "key": "contact_step"}, {"ask": "Kya koi group ya jagah hai jahan aap logon ke darmiyan reh sakein, jaise koi class, community ya mazhabi group, ya khel ka maidan?", "answer": "text_optional", "key": "community"}, {"ask": "Woh step uthana kitna bechain karega, 0 (bilkul calm) se 100 (sab se zyada bechaini jo aap soch sakein) tak?", "answer": "number_0_100", "key": "suds"}, {"ask": "Aap ko kitna confidence hai ke aap woh step utha lenge, 0 (bilkul nahi) se 10 (poori tarah) tak?", "answer": "number_0_10", "key": "commitment"}], "safety": "Only people the user feels safe with. Never suggest contacting a specific person, and never push contact with anyone the user describes as hurtful or unsafe.", "next": "Can become the first step on the Social Ladder (UX Flow 11).", "save": "Mere tasks mein add karein", "if_commitment_below": {"value": 7, "say": "Koi baat nahi. Kya cheez isay asaan bana sakti hai, ya koi is se chhota pehla step hai, jaise bas un ka aakhri message parh lena?", "source": "Brief Action Planning: below 7, problem-solve the plan."}, "ladder_rules": {"scale": "SUDS 0-100 (Wolpe)", "max_gap_between_steps": 10, "if_gap_larger": "split the step into smaller steps (UX Flow 11 'step-splitting')", "rate_before_and_after": true}}], "considered_and_not_added": [{"what": "Breathing with holds (box breathing, 4-7-8)", "why": "Breath holds can feel uncomfortable for anxious users, and WHO DWM warns against deep breaths when dizzy. Kept out of the default."}, {"what": "Long eyes-closed meditation or body scans", "why": "Meditation-related challenging experiences are documented (Lindahl et al. 2017). Not suitable unsupervised for a distressed audience."}, {"what": "Imagery or working through traumatic memories", "why": "Needs a clinician."}, {"what": "Progressive muscle relaxation, gratitude journaling", "why": "Common, but not sourced in this session. Can be added after sourcing."}, {"what": "Any exercise at CRITICAL, or as a replacement for helplines", "why": "PM+ and THP both exclude people with a plan to end their life or at imminent suicide risk."}], "_licence_note": "Licensing of adapted WHO material is being handled by the university (Ahmad, Oct 15 2026). Source attributions are kept for traceability.", "NUMBERS": [{"what": "Slow breathing pace", "value": "6 breaths/min (4 s in, 6 s out)", "status": "sourced", "source": "Resonance breathing ~0.1 Hz = six breaths per minute (Lehrer & Gevirtz 2014, Frontiers in Psychology); slow breathing defined as <10 breaths/min with reduced anxiety and arousal (Zaccaro et al. 2018 systematic review)."}, {"what": "Exhale longer than inhale", "value": "6 s out vs 4 s in", "status": "sourced, weak", "source": "An RCT comparing longer-exhale vs equal ratios found a small, non-significant extra benefit (d=0.2); 'breath ratios do not have a significant differential effect'. Kept because WHO DWM also says 'breathe out slowly'."}, {"what": "Breathing session length", "value": "1 min quick, or 5 min", "status": "sourced (5 min)", "source": "5 minutes daily of cyclic sighing improved mood and reduced anxiety over a month (Balban et al. 2023, Cell Reports Medicine RCT, n=108). The 1-minute option is a convenience choice with no specific source."}, {"what": "Cyclic sighing pattern", "value": "2 s in + 1 s top-up in, 6 s slow out (about 6-7 breaths/min)", "status": "pattern sourced, seconds estimated", "source": "Pattern from Balban et al. 2023 (two inhales, long exhale). Second counts are Claude's estimate kept under 10 breaths/min (Zaccaro 2018)."}, {"what": "Action-plan confidence check", "value": "0-10; below 7 -> make the plan smaller", "status": "sourced", "source": "Brief Action Planning (clinician technique): when confidence is below 7, use collaborative problem solving; people are more likely to succeed at 7 or more."}, {"what": "Distress rating for Social Ladder steps", "value": "SUDS 0-100; adjacent steps no more than 10 apart, else split", "status": "sourced", "source": "Wolpe's Subjective Units of Disturbance scale (0-100); hierarchy items spaced 'no more than 5 to 10 SUDs' apart."}, {"what": "Belief rating in thought check", "value": "0-100", "status": "convention", "source": "Standard CBT thought-record convention (Beck); not re-verified in this session."}, {"what": "Mood check", "value": "1-5", "status": "engineering default", "source": "No clinical source; simple scale chosen for a phone. Maps to the existing mood_rating field."}, {"what": "Offers per day", "value": "max 3", "status": "sourced", "source": "Morrison et al. 2017 (PLOS ONE): up to 3 notifications/day did not lower response rates; authors caution several per day may be unacceptable and exact thresholds are unknown."}, {"what": "CBT offer cooldown", "value": "24 h (72 h after 2 declines)", "status": "24 h loosely sourced; 72 h engineering default", "source": "A daily schedule had no response-rate penalty (Morrison et al. 2017)."}, {"what": "Crisis threshold for offers", "value": "MODERATE starts at 0.40", "status": "sourced (project canon)", "source": "Blueprint §4.1 risk bands."}, {"what": "Smoothing and hysteresis (EWMA 0.3, disarm 0.30, min 3 turns), grounding cooldown 2 h", "value": "as stated", "status": "engineering default", "source": "No clinical source exists for these; they control how often the app interrupts, and are disclosed as tunable."}], "ui": {"next": "Aagay", "stop": "Stop karein", "pause": "Pause", "resume": "Dobara shuru", "skip": "Skip karein", "done": "Ho gaya", "yes": "Haan", "no": "Nahi", "try_it": "Try karein", "smaller": "Isay chhota karein", "keep": "Aise hi rehne dein", "step_of": "Step {i} / {n}", "question_of": "Sawal {i} / {n}", "breath_of": "{s} sec · saans {c} / {n}", "stopped": "Stop kar diya. Yeh bilkul theek hai.", "all_exercises": "Saari exercises", "menu_note": "Aap in mein se koi bhi jab chahein shuru kar sakte hain.", "optional": "Jawab dena aap ki marzi hai.", "belief": "Is soch par yaqeen: {a} → {b}", "mood_n": "Mood 5 mein se {n}", "minutes": "min", "seconds": "sec", "families": {"calm_body": "Jism ko calm karein", "thoughts": "Soch ke saath kaam", "doing": "Kuch karna shuru karein", "connection": "Logon se judein"}}, "lang": "ur-roman"}}</script>
<script>
(function () {
  const CATS = JSON.parse(document.getElementById("data").textContent);   // {en, ur, ur-roman}: localized catalogues
  const LANG_NAMES = { "en": "English", "ur": "اردو", "ur-roman": "Roman Urdu" };
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  let D, U, byId, lang = "en", goTo = null, timer = null;

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === "onclick") n.onclick = v; else n.setAttribute(k, v); }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  function show(id) { ["offer", "player", "post"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

  function setLang(l) {
    lang = l; D = CATS[l]; U = D.ui; byId = Object.fromEntries(D.exercises.map(e => [e.id, e]));
    const app = $("app");
    app.setAttribute("dir", l === "ur" ? "rtl" : "ltr"); app.setAttribute("lang", l === "ur-roman" ? "ur-Latn" : l);
    $("langs").replaceChildren(...Object.keys(CATS).map(k =>
      el("button", { "aria-pressed": String(k === l), lang: k === "ur-roman" ? "ur-Latn" : k, onclick: () => setLang(k) }, LANG_NAMES[k])));
    renderLibrary(); renderOffer();
  }

  // ---- offer (UX Flow 5) with "what is it" (UX Flow 10)
  function renderOffer() {
    clearInterval(timer);
    const o = $("offer"), b = D.offer.buttons;
    o.replaceChildren(el("p", {}, D.offer.text), el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => play(goTo || "slow_breathing") }, b[0]),
      el("button", { onclick: () => o.replaceChildren(el("p", {}, D.offer.what_is_it), el("div", { class: "row" },
        el("button", { class: "primary", onclick: () => play("slow_breathing") }, b[0]),
        el("button", { onclick: renderDecline }, b[2]))) }, b[1]),
      el("button", { onclick: renderDecline }, b[2])));
    show("offer");
  }
  function renderDecline() {      // every branch offers something and an open "keep talking/later" choice
    const f = D.decline_followup, o = $("offer");
    o.replaceChildren(el("p", {}, f.text), el("div", { class: "row" }, ...f.buttons.map(btn =>
      el("button", { onclick: () => {
        const alt = f.alternatives[btn];
        o.replaceChildren(el("p", {}, alt.text), el("div", { class: "row" },
          ...alt.offer_exercises.map(x => el("button", { class: "primary", onclick: () => play(x) }, byId[x].title)),
          el("button", { onclick: renderOffer }, alt.later_button)));
      } }, btn))));
  }

  function renderLibrary() {
    const lib = $("library");
    lib.replaceChildren(el("h2", {}, U.all_exercises), el("p", { class: "muted" }, U.menu_note));
    for (const [k, label] of Object.entries(U.families)) {
      lib.append(el("p", { class: "chip" }, label));
      D.exercises.filter(e => e.family === k).forEach(e => {
        const dur = e.duration_min < 1 ? `${Math.round(e.duration_min * 60)} ${U.seconds}` : `${e.duration_min} ${U.minutes}`;
        lib.append(el("div", { class: "row lib" }, el("button", { "data-id": e.id, onclick: () => { window.scrollTo(0, 0); play(e.id); } }, `${e.title} · ${dur}`)));
      });
    }
  }

  // ---- player
  function play(id) {
    clearInterval(timer);
    const ex = byId[id];
    const p = $("player"); show("player");
    const stopBtn = el("button", { onclick: () => { clearInterval(timer); renderPost(ex, true); } }, U.stop);
    p.replaceChildren(el("h1", {}, ex.title), el("p", {}, ex.intro));
    if (ex.type === "paced_breathing") {
      p.append(el("p", { class: "muted" }, D.safety_note),
        el("div", { class: "row" }, ...ex.duration_options.map(o =>
          el("button", { class: "primary", onclick: () => startPaced(ex, o.cycles, p, stopBtn) }, o.label)), stopBtn));
    } else if (ex.type === "stepwise") {
      let i = 0; const step = el("p", { class: "phase" }), prog = el("div", { class: "count" });
      const draw = () => { step.textContent = ex.steps[i]; prog.textContent = fmt(U.step_of, { i: i + 1, n: ex.steps.length }); };
      const next = el("button", { class: "primary", onclick: () => { i++; i < ex.steps.length ? draw() : renderPost(ex, false); } }, U.next);
      p.append(step, prog, ex.stop_if ? el("p", { class: "muted" }, ex.stop_if) : null, el("div", { class: "row" }, next, stopBtn)); draw();
    } else {
      runConversation(ex, p, stopBtn);
    }
  }

  function startPaced(ex, cycles, p, stopBtn) {
    let paused = false;
    const pauseBtn = el("button", { onclick: () => { paused = !paused; pauseBtn.textContent = paused ? U.resume : U.pause; } }, U.pause);
    const orb = el("div", { class: "orb", "aria-hidden": "true" });
    const phase = el("div", { class: "phase center" }), count = el("div", { class: "count center" });
    p.replaceChildren(el("h1", {}, ex.title), el("p", { class: "muted" }, D.safety_note),
      el("div", { class: "stage" }, orb), phase, count, el("div", { class: "row" }, pauseBtn, stopBtn));
    const scale = { expand: "scale(1.15)", expand_more: "scale(1.35)", contract: "scale(0.7)" };
    const sched = [];
    for (let c = 0; c < cycles; c++) ex.phases.forEach(ph => sched.push({ ...ph, cycle: c + 1 }));
    let idx = -1, left = 0;
    function enter(i) {
      const ph = sched[i]; left = ph.seconds * 10; phase.textContent = ph.label;
      orb.style.transitionDuration = ph.seconds + "s";
      orb.style.transform = reduced ? "scale(0.85)" : scale[ph.animate];
    }
    timer = setInterval(() => {
      if (paused) return;
      if (left <= 0) { idx++; if (idx >= sched.length) { clearInterval(timer); renderPost(ex, false); return; } enter(idx); }
      left--;
      count.textContent = fmt(U.breath_of, { s: Math.ceil(left / 10), c: sched[idx].cycle, n: cycles });
    }, 100);
  }

  // conversation: one prompt at a time, free text (UX Flow 10: conversational, not a form).
  // In the app every answer is also a chat turn and passes the per-turn crisis check (policy R1).
  function runConversation(ex, p, stopBtn) {
    const answers = {}; let i = 0;
    const box = el("div", {});
    p.append(ex.stop_if ? el("p", { class: "muted" }, ex.stop_if) : null, box);
    const ranges = { number_0_100: [0, 100], number_0_10: [0, 10] };
    function input(pr) {
      if (ranges[pr.answer]) return el("input", { type: "number", min: ranges[pr.answer][0], max: ranges[pr.answer][1], "aria-label": pr.ask });
      return pr.answer === "yes_no" ? null : el("textarea", { "aria-label": pr.ask });
    }
    function step() {
      if (i >= ex.prompts.length) return finish();
      const pr = ex.prompts[i], field = input(pr);
      const examples = pr.answer === "choice_or_text" ? (ex.activity_examples || ex.value_examples) : null;
      const go = v => { answers[pr.key] = v; i++; step(); };
      const kids = [el("p", { class: "phase" }, pr.ask), el("div", { class: "count" }, fmt(U.question_of, { i: i + 1, n: ex.prompts.length }))];
      if (examples) kids.push(el("div", { class: "row" }, ...examples.map(x => el("button", { onclick: () => { field.value = x; } }, x))));
      if (pr.answer === "choice_from_options" && answers.options)
        kids.push(el("div", { class: "row" }, ...answers.options.split(/\n|,|،/).map(s => s.trim()).filter(Boolean)
          .map(x => el("button", { onclick: () => { field.value = x; } }, x))));
      if (pr.answer === "yes_no") {
        kids.push(el("div", { class: "row" },
          el("button", { class: "primary", onclick: () => go("yes") }, U.yes),
          el("button", { onclick: () => {
            if (!pr.if_no) return go("no");
            box.replaceChildren(el("p", {}, pr.if_no), el("div", { class: "row" },
              el("button", { class: "primary", onclick: () => play("dwm_making_room") }, byId.dwm_making_room.title),
              el("button", { onclick: () => play("dwm_being_kind") }, byId.dwm_being_kind.title), stopBtn));
          } }, U.no), stopBtn));
      } else {
        kids.push(field, el("div", { class: "row" }, el("button", { class: "primary", onclick: () => {
          const v = field.value.trim();
          if (!v && pr.answer !== "text_optional") { field.focus(); return; }
          if (pr.key === "commitment" && ex.if_commitment_below && Number(v) < ex.if_commitment_below.value) {
            box.replaceChildren(el("p", {}, ex.if_commitment_below.say), el("div", { class: "row" },
              el("button", { class: "primary", onclick: () => { i = 0; step(); } }, U.smaller),
              el("button", { onclick: () => go(v) }, U.keep), stopBtn));
            return;
          }
          go(v);
        } }, U.next), stopBtn));
      }
      box.replaceChildren(...kids);
    }
    function finish() {
      const kids = [];
      if (ex.reflection) kids.push(el("p", {}, ex.reflection));
      if (answers.belief_before && answers.belief_after)
        kids.push(el("p", { class: "muted" }, fmt(U.belief, { a: answers.belief_before, b: answers.belief_after })));
      kids.push(el("div", { class: "row" }, el("button", { class: "primary", onclick: () => renderPost(ex, false) }, ex.save || U.done)));
      box.replaceChildren(...kids);
    }
    step();
  }

  // ---- post check: optional 1-5 mood; always a "keep talking" way out (no dead end)
  function renderPost(ex, stoppedEarly) {
    clearInterval(timer);
    const q = D.post_check, p = $("post"); show("post");
    const nums = [];
    for (let n = q.scale.min; n <= q.scale.max; n++) nums.push(n);
    p.replaceChildren(el("p", {}, stoppedEarly ? U.stopped : (ex.outro || U.done)), el("p", {}, q.text),
      el("div", { class: "row" }, ...nums.map(n => el("button", { "aria-label": fmt(U.mood_n, { n }), onclick: () => {
        p.replaceChildren(el("p", {}, n <= q.low_threshold ? q.on_low : q.on_other), el("div", { class: "row" },
          el("button", { class: "primary", onclick: renderOffer }, q.keep_talking),
          el("button", { onclick: () => { goTo = ex.id; renderOffer(); } }, q.save_go_to),
          el("button", { onclick: renderOffer }, U.done)));
      } }, String(n))), el("button", { onclick: renderOffer }, U.skip)),
      el("p", { class: "muted" }, `${q.scale.min} = ${q.scale.min_label}, ${q.scale.max} = ${q.scale.max_label}. ${U.optional}`),
      el("div", { class: "row" }, el("button", { onclick: renderOffer }, q.keep_talking)));
  }

  setLang("en");
})();
</script>
